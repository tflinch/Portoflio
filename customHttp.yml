# Security headers applied by AWS Amplify Hosting.
#
# connect-src must list the contact-form Lambda's origin. Replace the wildcard
# below with your exact Function URL origin once it is stable, e.g.
#   https://abc123.lambda-url.us-east-1.on.aws
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains; preload'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'geolocation=(), microphone=(), camera=(), interest-cohort=()'
      - key: 'Content-Security-Policy'
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https://port-images-bucket.s3.us-east-1.amazonaws.com;
          font-src 'self' data:;
          connect-src 'self' https://*.lambda-url.us-east-1.on.aws;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
