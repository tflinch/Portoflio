# Security headers applied by AWS Amplify Hosting.
#
# connect-src is pinned to this app's exact Function URL. A wildcard such as
# https://*.lambda-url.us-east-1.on.aws would also permit any other AWS
# account's function in the region. Update this if the Function URL changes.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains; preload'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'geolocation=(), microphone=(), camera=(), interest-cohort=()'
      - key: 'Content-Security-Policy'
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https://port-images-bucket.s3.us-east-1.amazonaws.com;
          font-src 'self' data:;
          connect-src 'self' https://knb7mzuvqfi6wgxn3dvywkdyz40bmtmr.lambda-url.us-east-1.on.aws;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
